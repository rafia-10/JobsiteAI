# Frontend: static app + /api proxy. Deploy from repo root:
#   fly deploy --config frontend/fly.toml
app = "jobsiteai-web"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly private network hostname of the backend app
  BACKEND_HOST = "jobsiteai-api.internal"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/"
    type = "http"

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"
