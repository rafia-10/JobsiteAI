# Backend: FastAPI. Deploy from repo root:
#   fly deploy --config backend/fly.toml
app = "jobsiteai-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"
    type = "http"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"
